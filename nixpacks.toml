[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "pip install Flask==3.0.0 flask-sqlalchemy==3.1.1 gunicorn==21.2.0 pandas==2.1.3 numpy==1.26.2 openpyxl==3.1.2 sentence-transformers==2.2.2 psycopg2-binary==2.9.9",
  "pip install torch==2.1.1+cpu --index-url https://download.pytorch.org/whl/cpu"
]

[start]
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT"